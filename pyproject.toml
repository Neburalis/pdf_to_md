[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-md"
version = "0.1.0"
description = "Convert PDF to Markdown using local llama-cpp-python models"
requires-python = ">=3.10"
dependencies = [
    "gguf>=0.19.0",
    "huggingface-hub[cli]>=1.17.0",
    "llama-cpp-python",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.scripts]
pdf-to-md = "pdf_to_md.cli:main"

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]

[tool.uv]
package = true
